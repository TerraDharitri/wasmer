name: libwasmer-build

on:
  push:
    branches:
      - main
      - dev-laya
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build dynamic library for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: libwasmer_linux_amd64.so
            make_target: capi-linux-amd64
          - os: macos-14
            artifact_name: libwasmer_darwin_amd64.dylib
            make_target: capi-osx-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.72.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.72.0
          components: rustfmt, clippy

      - name: Show Rust version
        run: rustc --version

      - name: Make
        run: make ${{ matrix.make_target }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: |
            target/release/*.so
            target/release/*.dylib
            lib/runtime-c-api/wasmer.h
            lib/runtime-c-api/wasmer.hh