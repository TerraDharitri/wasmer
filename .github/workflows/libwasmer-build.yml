name: libwasmer-build

on:
  push:
    branches:
      - main
      - dev-laya
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build dynamic library for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            make_target: capi-linux-amd64
            artifact_name: linux-amd64

          - os: macos-12
            make_target: capi-osx-amd64
            artifact_name: darwin-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.59.0

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            pkg-config \
            patchelf \
            build-essential

      - name: Build library
        run: |
          make ${{ matrix.make_target }}

      - name: List build outputs
        run: |
          ls -R target/release || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-${{ matrix.artifact_name }}
          path: |
            target/release/libwasmer*.so
            target/release/libwasmer*.dylib
            target/release/build/*/out/wasmer.h*